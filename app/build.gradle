plugins {
    id 'com.android.application'
}

def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) {
    ks.load(new FileInputStream(ksFile))
}

android {
    namespace 'com.opentools.qqexport'
    compileSdk 34

    defaultConfig {
        applicationId "com.opentools.qqexport"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
