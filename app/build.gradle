plugins {
    id 'com.android.application'
}

def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) {
    ks.load(new FileInputStream(ksFile))
}

android {
    namespace 'com.opentools.qqexport'
    compileSdk 34

    defaultConfig {
        applicationId "com.opentools.qqexport"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.5"
    }
    // Markdown 导出末尾要打印工具版本，需要 BuildConfig；AGP 8 起默认不生成
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 有正式密钥就用正式签名；否则退回 debug 密钥，
            // 保证 CI 产物可直接安装（不能用于上架/分发）
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
